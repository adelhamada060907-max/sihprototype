[project]
name = "oceanguard"
version = "0.1.0"
description = "AquaGuard AI - Autonomous Marine Debris Detection"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.23.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.4.0",
    "python-multipart>=0.0.6",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "ultralytics>=8.0.0",
    "pillow>=10.0.0",
    "scipy>=1.11.0",
    "albumentations>=1.3.0",
    "requests>=2.31.0",
    "matplotlib>=3.7.0",
    "python-dotenv>=1.0.0",
]

[tool.vercel]
entrypoint = "backend.app.main:app"